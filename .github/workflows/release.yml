name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Validate release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          test -f "docs/releases/${version}.md"
          grep -Fq "versionName = \"${version}\"" app/build.gradle.kts

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.AUTOBILE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/autobile-release.jks"
          chmod 600 "$RUNNER_TEMP/autobile-release.jks"

      - name: Build and verify APK
        env:
          AUTOBILE_KEYSTORE: ${{ runner.temp }}/autobile-release.jks
          AUTOBILE_KEYSTORE_PASSWORD: ${{ secrets.AUTOBILE_KEYSTORE_PASSWORD }}
          AUTOBILE_KEY_ALIAS: ${{ secrets.AUTOBILE_KEY_ALIAS }}
          AUTOBILE_KEY_PASSWORD: ${{ secrets.AUTOBILE_KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ./gradlew lintDebug test assembleRelease
          version="${RELEASE_TAG#v}"
          apk="autobile-${version}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          sha256sum "$apk" > "${apk}.sha256"

          cp "docs/releases/${version}.md" release-notes.md
          certificate="$($ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          checksum="$(sha256sum "$apk" | cut -d' ' -f1)"
          {
            printf '\n## Verification\n\n'
            printf -- '- Signing certificate SHA-256: `%s`\n' "$certificate"
            printf -- '- APK SHA-256: `%s`\n' "$checksum"
          } >> release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" \
            "autobile-${version}.apk" \
            "autobile-${version}.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Autobile ${version}" \
            --notes-file release-notes.md
