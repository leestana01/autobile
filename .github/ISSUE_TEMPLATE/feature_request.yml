name: Feature request
description: Suggest a capability or a change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: Describe the task or situation, not the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like to happen
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: What could go wrong
      description: |
        This app acts on a user's phone. If the idea involves acting more autonomously,
        sending more off the device, or skipping a confirmation, describe the trade-off.
